<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(145deg,#0b1220,#18263a,#071018);
  color:#fff; display:flex; justify-content:center; align-items:center; padding:22px;
}
.card{
  width:min(430px,100%); padding:28px 22px 24px; border-radius:30px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(18px); box-shadow:0 25px 70px rgba(0,0,0,.45);
  text-align:center;
}
.avatar{
  width:125px;height:125px;border-radius:50%;object-fit:cover;
  border:4px solid rgba(255,255,255,.9); box-shadow:0 10px 35px rgba(0,0,0,.35);
}
h1{margin:16px 0 6px;font-size:27px}
.verified{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;
  border-radius:50%;background:#1683ff;color:#fff;font-size:14px;font-weight:bold;vertical-align:3px;margin-right:5px}
.sub{color:#cbd5e1;margin:0 0 20px;font-size:14px}
.btn{
  display:flex; align-items:center; justify-content:center; gap:10px;
  width:100%; padding:14px 16px; margin:10px 0; border-radius:16px;
  color:#fff; text-decoration:none; font-weight:700; font-size:16px;
  background:rgba(255,255,255,.11); border:1px solid rgba(255,255,255,.12);
  transition:.2s;
}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.17)}
.phone{background:#1683ff}
.whatsapp{background:#20b95b}
.footer{margin-top:20px;color:#94a3b8;font-size:12px}
